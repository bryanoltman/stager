name: stager
description: A Flutter productivity tool that allows developers to isolate pieces of UI.
version: 1.4.0
repository: https://github.com/bryanoltman/stager
issue_tracker: https://github.com/bryanoltman/stager/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.16.0"

dependencies:
  analyzer: '>=8.2.0 <15.0.0'
  build: '>=3.0.0 <5.0.0'
  flutter:
    sdk: flutter
  source_gen: '>=2.0.0 <5.0.0'

dev_dependencies:
  build_runner: ^2.7.0
  flutter_test:
    sdk: flutter
  lints: ^2.0.1
